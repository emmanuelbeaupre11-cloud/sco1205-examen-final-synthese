<title>SCO 1205 – Examen synthèse final</title>
<style>
:root{--b:#1a7f37;--g:#1a7f37;--r:#c62828;--bg:#f4f6f9}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:#222;-webkit-text-size-adjust:100%}
header{background:var(--b);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
header h1{font-size:1.1rem;margin:0}.stats{display:flex;gap:12px;flex-wrap:wrap;font-size:.9rem;margin-top:6px}
.bar{height:8px;background:#ffffff55;border-radius:4px;margin-top:8px;overflow:hidden}.bar div{height:100%;background:#ffd54f;width:0;transition:width .3s}
main{max-width:820px;margin:auto;padding:12px}
.card{background:#fff;border:1px solid #d0d7de;border-radius:6px;margin:14px 0;overflow:hidden}
.qh{background:#e7f1fb;padding:8px 12px;font-size:.85rem;display:flex;justify-content:space-between;border-bottom:1px solid #d0d7de}
.qb{padding:12px}.qt{margin:0 0 10px;line-height:1.45}
label.opt{display:flex;gap:8px;padding:10px;border-radius:4px;margin:4px 0;cursor:pointer;border:1px solid transparent;align-items:flex-start}
label.opt:hover{background:#f3f6fa}label.opt input{margin-top:3px;transform:scale(1.2)}
.ok{background:#e6f4ea!important;border-color:var(--g)!important}.ko{background:#fdecea!important;border-color:var(--r)!important}
button{font-size:1rem;padding:10px 16px;border-radius:6px;border:0;background:var(--b);color:#fff;cursor:pointer;margin:4px 4px 4px 0;-webkit-appearance:none}
button.sec{background:#e1e4e8;color:#222}button.on{background:#ffd54f;color:#222}button:disabled{opacity:.5}
.fb{margin-top:10px;padding:10px;border-radius:4px;font-size:.95rem;line-height:1.45;display:none;white-space:pre-line}
.fb.good{display:block;background:#e6f4ea}.fb.bad{display:block;background:#fdecea}
.filters{display:flex;flex-wrap:wrap}.timer{font-weight:bold}
table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:6px;text-align:left}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:9}
.cf{position:absolute;font-size:1.6rem;animation:fall 1.4s ease-in forwards}@keyframes fall{to{transform:translateY(100vh) rotate(540deg);opacity:0}}

html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{height:100dvh;display:flex;flex-direction:column;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;font-size:20px}
*{touch-action:manipulation}
header{position:relative;flex:none;padding:calc(12px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) 12px calc(20px + env(safe-area-inset-left))}
header h1{font-size:1.25rem}.stats{font-size:1rem}.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px}

const Q=[
{c:10,q:"Un client paie comptant un achat de 7,07 $. Avec l’arrondissement (abolition du 1 ¢), combien paie-t-il ?",o:["7,07 $","7,10 $","7,05 $","7,00 $"],a:2,e:"7,06 et 7,07 → 7,05; 7,08 et 7,09 → 7,10. L’arrondissement ne s’applique qu’aux paiements en argent comptant."},
{c:10,q:"Quelle règle de contrôle interne s’applique à la personne qui fait le rapprochement bancaire ?",o:["Elle signe aussi les chèques","Elle dépose aussi l’argent","Elle n’a aucune autre tâche liée aux encaissements et aux décaissements","Elle tient aussi le journal des décaissements"],a:2,e:"Séparation des tâches : celui qui rapproche ne manipule pas l’argent et n’enregistre pas les opérations."},
{c:8,q:"Un paiement à un fournisseur avec escompte de caisse est inscrit au journal des décaissements. Quelles colonnes sont touchées ?",o:["Clients (Crédit) et Escomptes sur ventes (Débit)","Fournisseurs (Crédit) et Caisse (Débit)","Achats (Débit) et Caisse (Crédit)","Fournisseurs (Débit), Caisse (Crédit) et Escomptes sur achats (Crédit)"],a:3,e:"La dette est réduite du montant brut (débit), l’argent payé est le net (crédit Caisse) et l’escompte obtenu est crédité."},
{c:7,q:"Quelle écriture ferme le compte Retraits ?",o:["Dt Retraits / Ct Capital","Dt Capital / Ct Retraits","Dt Retraits / Ct Sommaire des résultats","Dt Sommaire des résultats / Ct Retraits"],a:1,e:"Retraits (solde débiteur) est fermé directement au Capital, sans passer par le Sommaire des résultats."},
{c:13,q:"Un traiteur reçoit en novembre un dépôt de 1 500 $ pour un événement de février. En novembre, ce montant est :",o:["Un produit","Un passif","Une diminution des charges","Un actif à recevoir"],a:1,e:"Tant que le service n’est pas rendu, l’entreprise doit le rendre ou rembourser : produit reçu d’avance (passif)."},
{c:8,q:"L’entreprise obtient un emprunt bancaire de 15 000 $ déposé dans son compte. Où l’inscrit-on ?",o:["Journal des ventes","Journal des décaissements","Journal des encaissements, section Divers (Emprunt bancaire au crédit)","Journal général"],a:2,e:"C’est une entrée de fonds; le compte Emprunt n’a pas de colonne spéciale, il va dans Divers."},
{c:3,q:"Produits 27 300 $; charges 31 050 $. Résultat de l’exercice ?",o:["Bénéfice net de 3 750 $","Bénéfice net de 27 300 $","Perte nette de 58 350 $","Perte nette de 3 750 $"],a:3,e:"27 300 − 31 050 = −3 750 $ : perte nette, qui diminuera le capital."},
{c:5,q:"Facture de 7 450 $ (sans taxes) aux conditions 2/10, n/30, payée au 25e jour. Combien paie-t-on ?",o:["7 286 $","7 450 $","7 301,50 $","7 301 $"],a:1,e:"Le délai d’escompte de 10 jours est dépassé : aucun escompte; on paie le montant brut de 7 450 $."},
{c:2,q:"Achat de matériel de 6 000 $ : 1 500 $ comptant et le solde par un effet à payer. Quelle écriture ?",o:["Dt Matériel 6 000 / Ct Caisse 6 000","Dt Matériel 4 500, Dt Caisse 1 500 / Ct Effets à payer 6 000","Dt Matériel 6 000 / Ct Caisse 1 500, Ct Effets à payer 4 500","Dt Effets à payer 4 500, Dt Caisse 1 500 / Ct Matériel 6 000"],a:2,e:"Écriture composée : l’actif Matériel augmente de 6 000; la caisse baisse de 1 500; la dette augmente de 4 500. Débits = crédits = 6 000."},
{c:4,q:"Quel est le total des taxes (TPS + TVQ) sur une vente de 760 $ ?",o:["114,00 $","75,81 $","38,00 $","113,81 $"],a:3,e:"TPS = 38,00 $; TVQ = 760 × 9,975 % = 75,81 $. Total = 113,81 $."},
{c:8,q:"À quelle fréquence reporte-t-on les factures du journal des ventes aux comptes des clients du grand livre auxiliaire ?",o:["À la fin du mois","Chaque jour","Seulement lors du paiement","À la fin de l’exercice"],a:1,e:"Le report quotidien permet de connaître en tout temps le solde de chaque client; les totaux vont au grand livre général à la fin du mois."},
{c:4,q:"Lors d’une vente taxable au comptant, quels comptes sont crédités ?",o:["Ventes, TPS à payer et TVQ à payer","Ventes seulement","TPS à recevoir et Ventes","Caisse, TPS à recevoir et TVQ à recevoir"],a:0,e:"Dt Caisse (total) / Ct Ventes (avant taxes), Ct TPS à payer, Ct TVQ à payer : les taxes perçues sont des dettes envers l’État."},
{c:11,q:"Pourquoi Revenu Québec, l’ARC et les bailleurs de fonds exigent-ils la comptabilité d’exercice ?",o:["Elle ne tient compte que des encaissements","Elle est plus simple que la comptabilité de caisse","Elle mesure le bénéfice de chaque période en rattachant les charges aux produits","Elle évite les écritures de régularisation"],a:2,e:"La caisse peut montrer une perte l’année d’exécution d’un contrat et un gros bénéfice l’année d’encaissement; l’exercice reflète la vraie performance."},
{c:13,q:"Pourquoi la personne qui approuve un paiement ne devrait-elle pas être celle qui signe le chèque ?",o:["Pour séparer les tâches et réduire le risque de fraude ou d’erreur","Pour accélérer les paiements","Pour éviter les frais bancaires","Parce que la loi interdit de signer ses propres chèques"],a:0,e:"Mesure de contrôle interne de la trésorerie : approbation ≠ signature; on inscrit aussi « payé » sur les pièces pour éviter les doubles paiements."},
{c:6,q:"Billet à payer de 20 000 $ à 7,5 % signé le 1er octobre. Intérêts courus au 31 décembre ?",o:["375 $","500 $","1 500 $","125 $"],a:0,e:"20 000 × 7,5 % × 3/12 = 375 $ : Dt Intérêts / Ct Intérêts à payer."},
{c:2,q:"Quel est le solde normal du compte Apports du propriétaire ?",o:["Créditeur","Débiteur","Débiteur ou créditeur selon l’année","Toujours nul"],a:0,e:"Les capitaux propres augmentent au crédit; Apports a un solde normal créditeur."},
{c:7,q:"Capital au chiffrier 50 000 $ (solde du début), bénéfice net 14 000 $, apports 2 000 $, retraits 11 000 $. Solde du Capital après clôture ?",o:["53 000 $","55 000 $","64 000 $","77 000 $"],a:1,e:"50 000 + 14 000 + 2 000 − 11 000 = 55 000 $; ce solde doit correspondre au capital du bilan."},
{c:13,q:"Achat de marchandises à crédit de 5 000 $ (sans taxes). Effet sur l’équation comptable ?",o:["Actif +5 000 $; passif +5 000 $","Actif +5 000 $; capitaux propres +5 000 $","Passif +5 000 $; capitaux propres −5 000 $","Aucun effet"],a:0,e:"Stock/Achats et Fournisseurs augmentent du même montant; aucun effet sur les capitaux propres au moment de l’achat."},
{c:5,q:"Qu’est-ce qui distingue une entreprise commerciale d’une entreprise de services ?",o:["Elle n’a pas d’état des résultats","Elle achète des marchandises pour les revendre, d’où le coût des ventes et la marge brute","Elle n’a pas besoin de cycle comptable","Elle ne paie pas de TPS/TVQ"],a:1,e:"Le cycle comptable est le même, mais il faut des comptes supplémentaires (achats, ventes, retours, escomptes, stock, coût des ventes)."},
{c:9,q:"Un CPA indépendant facture des honoraires à l’entreprise. L’entreprise doit-elle effectuer des retenues à la source ?",o:["Oui : RRQ, AE et impôts","Oui : seulement l’AE","Oui : seulement l’impôt","Non : relation avec un tiers (honoraires), aucune retenue"],a:3,e:"Les retenues s’appliquent à la relation employeur-salarié. Pour des honoraires versés à un tiers, il n’y a pas de retenues ni de cotisations patronales."},
{c:10,q:"Quand le compte Petite caisse du grand livre est-il modifié ?",o:["À chaque dépense payée par la petite caisse","Chaque fin de semaine","Seulement lors de la création, de l’augmentation ou de la réduction du fonds","À chaque reconstitution"],a:2,e:"Les dépenses sont inscrites lors de la reconstitution (Dt charges / Ct Banque); le compte Petite caisse garde son montant fixe."},
{c:12,q:"Méthode indirecte : le stock a diminué de 3 000 $ pendant l’exercice. Comment l’ajuste-t-on ?",o:["Aucun ajustement","−3 000 $ en investissement","+3 000 $ au bénéfice net","−3 000 $ au bénéfice net"],a:2,e:"Baisse d’un actif à court terme = trésorerie libérée → on ajoute."},
{c:5,q:"Achats 64 000 $; rendus et rabais sur achats 2 100 $; escomptes sur achats 900 $; transport sur achats 1 500 $. Quel est le coût des achats (achats nets + transport) ?",o:["68 500 $","62 500 $","61 000 $","59 500 $"],a:1,e:"64 000 − 2 100 − 900 = 61 000 $ d’achats nets; + transport 1 500 = 62 500 $."},
{c:7,q:"Dans un chiffrier, l’entreprise a subi une perte nette. Où inscrit-on la perte ?",o:["Au débit de Résultats et au crédit de Bilan","Au crédit des deux sections","Au crédit de la section Résultats et au débit de la section Bilan","Dans la balance régularisée seulement"],a:2,e:"Les charges (débits) dépassent les produits : on équilibre au crédit de Résultats; la perte réduit le capital (débit au Bilan)."},
{c:10,q:"La banque a débité par erreur le compte de l’entreprise d’un chèque appartenant à un autre client. Comment traite-t-on cet élément ?",o:["On l’ignore","On l’ajoute au solde aux livres","On le soustrait du solde aux livres et on passe une écriture","On l’ajoute au solde du relevé bancaire; aucune écriture aux livres"],a:3,e:"Erreur de la banque : correction du côté du relevé, sans écriture; la banque devra corriger."},
{c:3,q:"Des services sont rendus en décembre, facturés en décembre et encaissés en janvier. Dans quel exercice le produit est-il constaté ?",o:["Décembre (exercice où il est gagné)","Au choix de l’entreprise","Moitié-moitié","Janvier (encaissement)"],a:0,e:"Principe de réalisation et comptabilité d’exercice : le produit est constaté quand il est gagné."},
{c:2,q:"Un achat de fournitures de 300 $ est débité par erreur au compte Matériel au lieu de Fournitures. La balance de vérification :",o:["Montre un écart de 600 $","Montre un écart de 300 $","Ne peut pas être préparée","Reste équilibrée : l’erreur n’est pas décelée"],a:3,e:"Le débit est du bon montant, seulement dans le mauvais compte : débits = crédits. La balance ne détecte pas les erreurs d’imputation."},
{c:13,q:"L’entreprise paie 2 400 $ pour une assurance couvrant les 12 prochains mois. Au moment du paiement, c’est :",o:["Un passif","Une charge de l’exercice entier","Un produit","Un actif (assurance payée d’avance)"],a:3,e:"Le coût procure un avantage futur : actif; il deviendra charge au fil des mois consommés."},
{c:12,q:"Frais de vente et d’administration 9 200 $; frais payés d’avance 900 $ (ouverture) et 600 $ (clôture); charges à payer 1 100 $ (ouverture) et 700 $ (clôture). Sommes versées ?",o:["9 300 $","9 200 $","8 300 $","9 100 $"],a:0,e:"9 200 + (600 − 900) + (1 100 − 700) = 9 200 − 300 + 400 = 9 300 $."},
{c:9,q:"Quelle écriture constate les cotisations de l’employeur (charges sociales) ?",o:["Dt Charges sociales / Ct RRQ à payer, AE à payer, RQAP à payer, FSS à payer, CNESST à payer","Dt RRQ à payer / Ct Charges sociales","Dt Charges sociales / Ct Salaires","Dt Salaires / Ct Banque"],a:0,e:"Les cotisations patronales sont une charge de l’employeur et des dettes envers les organismes jusqu’à leur remise."},
{c:5,q:"Le coût des ventes de l’exercice est de 44 500 $. Le stock au début était de 12 000 $ et les achats nets de 48 000 $. Quel est le stock à la fin ?",o:["104 500 $","4 500 $","15 500 $","16 500 $"],a:2,e:"Marchandises disponibles = 12 000 + 48 000 = 60 000 $; stock à la fin = 60 000 − 44 500 = 15 500 $."},
{c:9,q:"Un vendeur reçoit un salaire de base de 600 $ par semaine plus une commission de 3 % sur ses ventes de la semaine, qui totalisent 12 400 $. Paie brute ?",o:["1 344 $","372 $","600 $","972 $"],a:3,e:"Commission = 12 400 × 3 % = 372 $. Paie brute = 600 + 372 = 972 $."},
{c:6,q:"Le compte Fournitures de bureau a un solde de 1 900 $; l’inventaire de fin d’exercice montre 420 $ de fournitures en main. Quelle régularisation ?",o:["Dt Fournitures utilisées 2 320 / Ct Fournitures de bureau 2 320","Dt Fournitures de bureau 1 480 / Ct Fournitures utilisées 1 480","Dt Fournitures utilisées 1 480 / Ct Fournitures de bureau 1 480","Dt Fournitures utilisées 420 / Ct Fournitures de bureau 420"],a:2,e:"Utilisées = 1 900 − 420 = 1 480 $ (charge). L’actif doit rester à 420 $."},
{c:1,q:"Une poursuite importante contre l’entreprise est en cours à la fin de l’exercice. Pourquoi faut-il la mentionner dans les états financiers ?",o:["Principe de la réalisation","Principe du coût d’origine","Principe de la bonne information : elle peut influencer les décisions des utilisateurs","Il ne faut pas la mentionner avant le jugement"],a:2,e:"La bonne information exige de présenter tout renseignement pertinent susceptible d’influencer les décisions."},
{c:3,q:"Lequel de ces éléments est une charge ?",o:["Électricité et chauffage du mois","Achat d’un terrain","Remboursement du capital d’un emprunt","Retrait du propriétaire"],a:0,e:"Une charge est un coût consommé pour générer les produits. Le terrain est un actif, le remboursement réduit un passif, le retrait réduit les CP sans être une charge."},
{c:11,q:"En comptabilité de caisse, une vente à crédit de 1 000 $ suivie d’une note de crédit de 100 $ puis d’un encaissement de 900 $ donne lieu à :",o:["Deux écritures","Une seule écriture de 900 $ (l’encaissement)","Aucune écriture","Trois écritures"],a:1,e:"La caisse n’inscrit que les opérations qui touchent la trésorerie, d’où un gain de temps (mais pas de suivi des comptes clients)."},
{c:4,q:"Un montant de 2 299,50 $ est payé taxes incluses. Quelle est la TVQ comprise ?",o:["209,48 $","100,00 $","199,50 $","229,95 $"],a:2,e:"Avant taxes = 2 299,50 ÷ 1,14975 = 2 000,00 $. TVQ = 2 000 × 9,975 % = 199,50 $ (TPS = 100,00 $)."},
{c:3,q:"Le propriétaire retire 1 000 $ de l’entreprise pour usage personnel. Effet sur l’équation ?",o:["Charge de 1 000 $ à l’état des résultats","Actif −1 000 $; passif −1 000 $","Aucun effet sur les capitaux propres","Actif −1 000 $; capitaux propres −1 000 $"],a:3,e:"Dt Retraits / Ct Caisse : l’actif et les capitaux propres diminuent; le bénéfice n’est pas touché."},
{c:13,q:"Quelle mesure fait partie du contrôle interne des encaissements ?",o:["Signer les chèques à l’avance","Confier la caisse et le journal des encaissements à la même personne","Payer les petites dépenses à même les recettes du jour","Dresser la liste des encaissements dès leur réception et déposer tout l’argent chaque jour"],a:3,e:"Liste immédiate + dépôt intégral quotidien : le relevé bancaire peut alors être comparé aux encaissements inscrits."},
{c:1,q:"Passif total 38 700 $ et capitaux propres 61 300 $. Quel est l’actif total ?",o:["100 000 $","38 700 $","61 300 $","22 600 $"],a:0,e:"Actif = Passif + Capitaux propres = 38 700 + 61 300 = 100 000 $."},
{c:3,q:"Capital au début 40 000 $, bénéfice net 12 500 $, retraits 9 000 $, apports 3 000 $. Capital à la fin ?",o:["43 500 $","64 500 $","49 500 $","46 500 $"],a:3,e:"40 000 + 3 000 + 12 500 − 9 000 = 46 500 $."},
{c:4,q:"Pour la période : TPS perçue 900 $, CTI 1 400 $. Quelle est la situation pour la TPS ?",o:["Remise de 2 300 $ à payer","Aucun montant","Remboursement de 500 $ à recevoir du gouvernement","Remise de 500 $ à payer"],a:2,e:"TPS nette = 900 − 1 400 = −500 $ : les CTI excèdent la TPS perçue → montant à recevoir."},
{c:9,q:"Paie brute de 900 $; taux RQAP du salarié 0,548 % (aucune exemption). Retenue RQAP ?",o:["49,32 $","6,90 $","4,93 $","0,00 $"],a:2,e:"RQAP = 900 × 0,548 % = 4,93 $. Le RQAP ne comporte pas d’exemption par période (contrairement au RRQ)."},
{c:12,q:"Flux d’exploitation 18 000 $; investissement (25 000 $); financement 9 000 $; trésorerie à l’ouverture 6 500 $. Trésorerie à la clôture ?",o:["4 500 $","8 500 $","58 500 $","2 000 $"],a:1,e:"Variation nette = 18 000 − 25 000 + 9 000 = +2 000 $; clôture = 6 500 + 2 000 = 8 500 $."},
{c:12,q:"Un équipement de 40 000 $ est acheté et financé directement par le vendeur (paiements mensuels). Effet sur l’état des flux de trésorerie au moment de l’achat ?",o:["Entrée de 40 000 $ en financement","Sortie de 40 000 $ en investissement seulement","Sortie de 40 000 $ en investissement et entrée en financement","Aucun flux : opération sans effet sur la trésorerie (note)"],a:3,e:"Financé directement par le vendeur : aucun argent ne circule. Si un tiers prêteur était intervenu, on présenterait deux flux."},
{c:4,q:"Un service de 3 200 $ (avant taxes) est acheté à crédit. Quel montant est crédité à Fournisseurs ?",o:["3 519,20 $","3 360,00 $","3 200,00 $","3 679,20 $"],a:3,e:"TPS 160,00 $ + TVQ 319,20 $ = 479,20 $. Fournisseurs = 3 679,20 $ (Dt charge 3 200, Dt TPS à recevoir, Dt TVQ à recevoir)."},
{c:11,q:"Honoraires encaissés 95 000 $ (à recevoir : 6 000 $ début, 8 500 $ fin). Frais décaissés 52 000 $ (à payer : 2 200 $ début, 3 000 $ fin; payés d’avance : 1 000 $ début, 1 400 $ fin). Amortissement 4 000 $. Bénéfice net (exercice) ?",o:["45 100 $","41 100 $","43 000 $","39 500 $"],a:1,e:"Produits = 95 000 + 8 500 − 6 000 = 97 500 $.\nCharges = 52 000 + 3 000 − 2 200 + 1 000 − 1 400 + 4 000 = 56 400 $.\nBénéfice = 97 500 − 56 400 = 41 100 $."},
{c:10,q:"Solde du compte Banque aux livres 2 340 $. Le relevé révèle : dépôts directs de clients 610 $, frais bancaires 18 $, chèque sans provision d’un client 125 $. Solde réel aux livres ?",o:["2 950 $","2 807 $","3 093 $","1 587 $"],a:1,e:"2 340 + 610 − 18 − 125 = 2 807 $. Chacun de ces éléments exige une écriture d’ajustement."},
{c:1,q:"Quel principe justifie qu’on suppose qu’une entreprise remboursera sa dette à long terme selon l’échéancier prévu ?",o:["L’indépendance des exercices","La prééminence de la substance sur la forme","L’objectivité","La continuité de l’exploitation"],a:3,e:"On présume que l’entreprise poursuivra ses activités assez longtemps : cela soutient les estimations de durée de vie et de remboursement."},
{c:12,q:"Le remboursement du capital d’un emprunt hypothécaire est présenté en :",o:["Il n’est pas présenté","Activités de financement (sortie)","Activités d’exploitation","Activités d’investissement"],a:1,e:"Les capitaux empruntés relèvent du financement; seuls les intérêts payés vont en exploitation."},
{c:11,q:"Lors du passage de la caisse à l’exercice, comment traite-t-on la dépréciation des comptes clients ?",o:["On l’ajoute aux charges (charge sans sortie de fonds)","On la soustrait des charges","On l’ajoute aux produits","On l’ignore, car rien n’a été payé"],a:0,e:"Comme l’amortissement, c’est une charge sans décaissement qu’il faut ajouter (tableau 11.2)."},
{c:9,q:"Paie brute 1 000,00 $; total des retenues 248,35 $. Quelle est la paie nette ?",o:["761,65 $","1 000,00 $","751,65 $","1 248,35 $"],a:2,e:"Paie nette = brute − retenues = 1 000,00 − 248,35 = 751,65 $."},
{c:2,q:"Le compte Fournisseurs a un solde créditeur d’ouverture de 2 900 $. Achats à crédit du mois 5 400 $; paiements 6 100 $. Solde de fin ?",o:["14 400 $ créditeur","700 $ débiteur","3 600 $ créditeur","2 200 $ créditeur"],a:3,e:"Passif : + au crédit, − au débit. 2 900 + 5 400 − 6 100 = 2 200 $ créditeur."},
{c:6,q:"Matériel acquis le 1er mai pour 48 000 $, valeur résiduelle 6 000 $, durée 7 ans, amortissement linéaire. Charge au 31 décembre ?",o:["6 000 $","4 571 $","4 000 $","5 486 $"],a:2,e:"(48 000 − 6 000) ÷ 7 = 6 000 $/an; mai à décembre = 8 mois : 6 000 × 8/12 = 4 000 $."},
{c:8,q:"Le recouvrement d’un compte client par chèque est inscrit dans le :",o:["Journal des achats","Journal des encaissements","Journal des ventes","Journal général"],a:1,e:"Toute entrée de fonds va au journal des encaissements (colonne Clients au crédit, Caisse au débit)."},
{c:6,q:"On oublie d’inscrire des salaires courus à la fin de l’exercice. Quel est l’effet ?",o:["Charges sous-évaluées, bénéfice surévalué, passif sous-évalué","Charges surévaluées, bénéfice sous-évalué","Actif surévalué, passif surévalué","Aucun effet sur le bénéfice"],a:0,e:"La charge et la dette Salaires à payer manquent : le bénéfice est trop élevé et le passif trop faible."},
{c:6,q:"Le 1er septembre, 6 000 $ d’abonnements annuels (12 mois) ont été reçus et crédités entièrement au compte de produit Abonnements. Régularisation au 31 décembre ?",o:["Aucune régularisation","Dt Abonnements 4 000 / Ct Abonnements reçus d’avance 4 000","Dt Abonnements 2 000 / Ct Abonnements reçus d’avance 2 000","Dt Abonnements reçus d’avance 2 000 / Ct Abonnements 2 000"],a:1,e:"Gagné : 4 mois = 2 000 $. Non gagné : 8 mois = 4 000 $, à retirer du produit et à présenter au passif."},
{c:10,q:"Un chèque certifié a été émis par l’entreprise et n’a pas encore été encaissé par le bénéficiaire. Au rapprochement :",o:["On l’ajoute au solde aux livres","On le soustrait du solde du relevé","On le soustrait du solde aux livres","Il n’est pas un chèque en circulation : la banque l’a déjà déduit"],a:3,e:"La banque débite le compte dès la certification, et l’entreprise l’a inscrit à l’émission : il n’est un élément de rapprochement d’aucun côté."},
{c:12,q:"BNR à l’ouverture 50 000 $; bénéfice net 18 000 $; BNR à la clôture 61 000 $; aucun dividende à payer. Dividendes versés ?",o:["18 000 $","7 000 $","11 000 $","29 000 $"],a:1,e:"Dividendes = 50 000 + 18 000 − 61 000 = 7 000 $ (sortie en financement)."},
{c:5,q:"Un client paie une facture de 3 000 $ dans le délai et profite d’un escompte de 60 $ (ignorer les taxes). Quelle écriture ?",o:["Dt Caisse 2 940 / Ct Clients 2 940, Ct Ventes 60","Dt Caisse 3 000 / Ct Clients 3 000","Dt Caisse 2 940, Dt Escomptes sur ventes 60 / Ct Clients 3 000","Dt Caisse 2 940 / Ct Clients 2 940"],a:2,e:"Le compte client est soldé au montant brut; l’escompte est un compte de contrepartie des ventes."},
{c:7,q:"Pour laquelle de ces régularisations une écriture de contrepassation est-elle appropriée ?",o:["Intérêts à recevoir (produit couru)","Assurance absorbée, quand la prime a été inscrite à l’actif","Amortissement du matériel","Fournitures utilisées, quand l’achat a été inscrit à l’actif"],a:0,e:"On contrepasse quand la régularisation a créé un actif ou un passif à régler plus tard (à recevoir, à payer). Jamais pour l’amortissement."},
{c:7,q:"Au bilan dressé à partir du chiffrier, où présente-t-on la tranche de la dette à long terme échéant dans moins d’un an ?",o:["Au passif à long terme avec le reste","Dans les capitaux propres","Au passif à court terme","En note seulement"],a:2,e:"La portion exigible à moins d’un an est un passif à court terme; le reste demeure à long terme."},
{c:1,q:"Une entreprise change chaque année de méthode d’amortissement pour présenter le bénéfice le plus élevé possible. Quel principe ne respecte-t-elle pas ?",o:["La réalisation","La permanence des méthodes","La personnalité de l’entité","Le coût d’origine"],a:1,e:"Changer de méthode sans justification empêche de comparer les exercices : c’est contraire à la permanence des méthodes."},
{c:13,q:"Que signifie l’abréviation NCECF ?",o:["Normes de contrôle des encaissements et des chèques fiscaux","Nouvelles conventions des états de caisse et de flux","Normes canadiennes d’éthique des comptables fiscalistes","Normes comptables pour les entreprises à capital fermé"],a:3,e:"Ce sont les normes de référence des PME à capital fermé au Canada (Manuel de CPA Canada)."},
];
const L="abcd";let mode="P",chf="all",list=[],score=0,done=0,streak=0,timer=null,tleft=0,res={};
const $=id=>document.getElementById(id);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function filters(){const f=$("flt");f.innerHTML="";[["all","Tous ("+Q.length+")"]].concat(Object.keys(CH).map(k=>[k,CH[k]+" ("+Q.filter(q=>q.c==k).length+")"])).forEach(([k,t])=>{const b=document.createElement("button");b.textContent=t;b.className=chf==k?"on":"sec";b.disabled=mode=="E";b.onclick=()=>{chf=k;start()};f.appendChild(b)})}
function start(){clearInterval(timer);$("tm").textContent="";score=done=streak=0;res={};$("end").innerHTML="";
 let pool=Q.map((q,i)=>Object.assign({id:i},q));if(mode=="P"&&chf!="all")pool=pool.filter(q=>q.c==chf);
 pool=shuffle(pool);if(mode=="E")pool=pool.slice(0,20);
 list=pool.map(q=>{const idx=shuffle([0,1,2,3]);return Object.assign({},q,{o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a),ans:null})});
 $("md").textContent=mode=="E"?"Mode examen":"Mode pratique";filters();render();upd();
 if(mode=="E"){tleft=30*60;tick();timer=setInterval(tick,1000)}window.scrollTo(0,0)}
function tick(){tleft--;const m=Math.floor(tleft/60),s=tleft%60;$("tm").textContent="⏱ "+m+":"+String(s).padStart(2,"0");if(tleft<=0)finish()}
function render(){const c=$("qs");c.innerHTML="";list.forEach((q,n)=>{const d=document.createElement("div");d.className="card";
 d.innerHTML=`<div class="qh"><span><b>Question ${n+1}</b> · ${CH[q.c]}</span><span>Noté sur 1,00</span></div><div class="qb"><p class="qt">${q.q}</p>`+
 q.o.map((o,i)=>`<label class="opt" id="l${n}_${i}"><input type="radio" name="q${n}" value="${i}"> <span>${L[i]}. ${o}</span></label>`).join("")+
 `<button id="v${n}">${mode=="E"?"Enregistrer":"Vérifier"}</button><div class="fb" id="f${n}"></div></div>`;c.appendChild(d);
 d.querySelector("#v"+n).onclick=()=>check(n)});
 if(mode=="E"){const b=document.createElement("button");b.textContent="Terminer l’examen";b.onclick=finish;c.appendChild(b)}}
function check(n){const q=list[n],sel=document.querySelector(`input[name=q${n}]:checked`);if(!sel){alert("Choisissez une réponse.");return}
 if(q.ans!==null&&mode=="P")return;const first=q.ans===null;q.ans=+sel.value;
 if(mode=="E"){if(first)done++;$("v"+n).textContent="Enregistrée ✔";upd();return}
 done++;$("v"+n).disabled=true;document.querySelectorAll(`input[name=q${n}]`).forEach(i=>i.disabled=true);
 const ok=q.ans==q.a;tally(q,ok);$("l"+n+"_"+q.a).classList.add("ok");if(!ok)$("l"+n+"_"+q.ans).classList.add("ko");
 const f=$("f"+n);f.className="fb "+(ok?"good":"bad");f.textContent=(ok?"✅ Bonne réponse ! ":"❌ Incorrect. Bonne réponse : "+L[q.a]+". ")+"\n"+q.e;
 if(ok){streak++;confetti(streak>=3)}else streak=0;upd();if(done==list.length)setTimeout(finish,600)}
function tally(q,ok){res[q.c]=res[q.c]||[0,0];res[q.c][1]++;if(ok){res[q.c][0]++;score++}}
function upd(){$("sc").textContent=score;$("tt").textContent=mode=="E"?list.length:done;$("st").textContent=streak;$("pb").style.width=(list.length?100*done/list.length:0)+"%"}
function confetti(big){const e=["🎉","⭐","✨","💰","🧾","👏"],c=$("confetti");for(let i=0;i<(big?24:10);i++){const s=document.createElement("span");s.className="cf";s.textContent=e[i%e.length];s.style.left=Math.random()*100+"vw";s.style.top="-30px";s.style.animationDelay=Math.random()*.4+"s";c.appendChild(s);setTimeout(()=>s.remove(),2000)}}
function finish(){clearInterval(timer);if(mode=="E"){score=0;res={};list.forEach((q,n)=>{const ok=q.ans===q.a;tally(q,ok);
 document.querySelectorAll(`input[name=q${n}]`).forEach(i=>i.disabled=true);$("v"+n).disabled=true;$("l"+n+"_"+q.a).classList.add("ok");
 if(q.ans!==null&&!ok)$("l"+n+"_"+q.ans).classList.add("ko");const f=$("f"+n);f.className="fb "+(ok?"good":"bad");
 f.textContent=(ok?"✅ ":"❌ "+(q.ans===null?"Sans réponse. ":"")+"Bonne réponse : "+L[q.a]+". ")+"\n"+q.e})}
 const tot=list.length,pct=Math.round(100*score/tot);let rows=Object.keys(res).map(k=>`<tr><td>${CH[k]}</td><td>${res[k][0]} / ${res[k][1]}</td><td>${Math.round(100*res[k][0]/res[k][1])} %</td></tr>`).join("");
 $("end").innerHTML=`<div class="card"><div class="qh"><b>Résultats</b><span>${pct>=80?"🏆":pct>=60?"👍":"📚"}</span></div><div class="qb"><p style="font-size:1.3rem">Note : <b>${score.toFixed(2).replace(".",",")} / ${tot},00</b> (${pct} %)</p><table><tr><th>Chapitre</th><th>Score</th><th>%</th></tr>${rows}</table><p><button id="rs">🔄 Recommencer</button></p></div></div>`;
 $("rs").onclick=start;$("sc").textContent=score;if(pct>=80)confetti(true);$("end").scrollIntoView({behavior:"smooth"})}
$("bP").onclick=()=>{mode="P";$("bP").className="on";$("bE").className="sec";start()};
$("bE").onclick=()=>{mode="E";chf="all";$("bE").className="on";$("bP").className="sec";start()};

</script>
<script>
/* ===== Persistance (localStorage, préfixe sco1205c_) ===== */
var SP="sco1205c_";
function lsGet(k,d){try{var v=window.localStorage.getItem(SP+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{window.localStorage.setItem(SP+k,JSON.stringify(v));return true}catch(e){return false}}
function lsDel(k){try{window.localStorage.removeItem(SP+k)}catch(e){}}
function lsClearAll(){try{var ks=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(SP)===0)ks.push(k)}ks.forEach(function(k){localStorage.removeItem(k)})}catch(e){}}
var HIST=lsGet("hist",{});            // id -> {n,ok,last,res,t}
function qStatus(id){var h=HIST[id];if(!h||!h.n)return 0;if(h.res===false)return 1;if(h.ok/h.n<.5)return 2;return 3}
function isWeak(id){var h=HIST[id];return !!h&&h.n>0&&(h.res===false||h.ok/h.n<.5)}
function computeMastery(){var m={};Object.keys(CH).forEach(function(c){var qs=Q.map(function(q,i){return i}).filter(function(i){return Q[i].c==c}),a=0,o=0,ms=0;
 qs.forEach(function(i){var h=HIST[i];if(h){a+=h.n;o+=h.ok;if(h.res)ms++}});m[c]={q:qs.length,att:a,ok:o,rate:a?Math.round(100*o/a):null,mastery:Math.round(100*ms/qs.length)}});return m}
function recordAnswer(q,ok){var h=HIST[q.id]||{n:0,ok:0};h.n++;if(ok)h.ok++;h.last=q.ans===null?null:L[Q[q.id].o.indexOf(q.o[q.ans])];h.res=!!ok;h.t=Date.now();HIST[q.id]=h;
 lsSet("hist",HIST);var s=lsGet("stats",{answered:0,correct:0});s.answered++;if(ok)s.correct++;s.updated=Date.now();lsSet("stats",s);lsSet("mastery",computeMastery())}
function badge(id){var h=HIST[id];if(!h||!h.n)return'<span class="bdg nw">Nouvelle</span>';
 return h.res?'<span class="bdg okb">✅ réussie '+h.ok+'/'+h.n+'</span>':'<span class="bdg kob">❌ ratée la dernière fois</span>'}
/* ===== Session en cours ===== */
var examEnd=0,resuming=lsGet("session",null);
function curIdx(){var cs=document.querySelectorAll("#qs>.card");for(var i=0;i<cs.length;i++)if(cs[i].classList.contains("cur"))return i;return 0}
function saveSession(){if(!list.length||document.body.classList.contains("done")){lsDel("session");return}
 lsSet("session",{mode:mode,chf:chf,score:score,done:done,streak:streak,res:res,examEnd:examEnd,cur:curIdx(),t:Date.now(),
  list:list.map(function(q){return{id:q.id,p:q.o.map(function(o){return Q[q.id].o.indexOf(o)}),ans:q.ans}})})}
function modeLabel(){return mode=="E"?"Mode examen":mode=="R"?"Revoir mes erreurs":"Mode pratique"}
function setModeBtns(){$("bP").className=mode=="P"?"on":"sec";$("bE").className=mode=="E"?"on":"sec";var r=$("bR");if(r)r.className=mode=="R"?"on":"sec"}
function restoreUI(){list.forEach(function(q,n){if(q.ans===null)return;var r=document.querySelector('input[name=q'+n+'][value="'+q.ans+'"]');if(r)r.checked=true;
 if(mode=="E"){$("v"+n).textContent="Enregistrée ✔";return}
 $("v"+n).disabled=true;document.querySelectorAll('input[name=q'+n+']').forEach(function(i){i.disabled=true});var ok=q.ans==q.a;
 $("l"+n+"_"+q.a).classList.add("ok");if(!ok)$("l"+n+"_"+q.ans).classList.add("ko");var f=$("f"+n);f.className="fb "+(ok?"good":"bad");
 f.textContent=(ok?"✅ Bonne réponse ! ":"❌ Incorrect. Bonne réponse : "+L[q.a]+". ")+"\n"+q.e})}
(function(){
var s0=start;
start=function(){var S=resuming;resuming=null;
 if(S&&S.list&&S.list.length){try{
  clearInterval(timer);$("end").innerHTML="";mode=S.mode;chf=S.chf;score=S.score;done=S.done;streak=S.streak;res=S.res||{};examEnd=S.examEnd||0;
  list=S.list.map(function(x){var q=Q[x.id];return Object.assign({id:x.id},q,{o:x.p.map(function(i){return q.o[i]}),a:x.p.indexOf(q.a),ans:x.ans})});
  setModeBtns();$("md").textContent=modeLabel();$("tm").textContent="";filters();render();restoreUI();upd();
  if(mode=="E"){tleft=Math.max(1,Math.round((examEnd-Date.now())/1000)+1);tick();if(tleft>0)timer=setInterval(tick,1000)}
  setTimeout(function(){if(window.goQ&&!document.body.classList.contains("done"))goQ(S.cur||0);saveSession()},0);return}catch(e){lsDel("session")}}
 if(mode=="R"){var ids=Q.map(function(q,i){return i}).filter(function(i){return isWeak(i)&&(chf=="all"||Q[i].c==chf)});
  if(!ids.length){alert(chf=="all"?"Aucune erreur à revoir 🎉":"Aucune erreur à revoir dans ce chapitre 🎉");mode="P";setModeBtns()}}
 s0();$("md").textContent=modeLabel();
 if(mode!="E"){var p=list.slice(),ord=shuffle(p.map(function(_,i){return i}));var rk={};ord.forEach(function(v,i){rk[v]=i});
  if(mode=="R")p=p.filter(function(q){return isWeak(q.id)});
  p=p.map(function(q,i){return{q:q,k:[qStatus(q.id)==0?0:qStatus(q.id)==1?1:qStatus(q.id)==2?2:3,rk[i]]}}).sort(function(x,y){return x.k[0]-y.k[0]||x.k[1]-y.k[1]}).map(function(x){return x.q});
  list=p;render();upd()}
 setModeBtns();examEnd=mode=="E"?Date.now()+30*60*1000:0;saveSession()};
var r0=render;
render=function(){r0();var cs=document.querySelectorAll("#qs>.card");list.forEach(function(q,n){var h=cs[n]&&cs[n].querySelector(".qh>span");if(h)h.insertAdjacentHTML("beforeend"," "+badge(q.id))})};
var c0=check;
check=function(n){var q=list[n],d0=done,a0=q.ans;c0(n);
 if(mode!="E"&&done>d0)recordAnswer(q,q.ans==q.a);saveSession()};
var f0=finish;
finish=function(){var wasE=mode=="E";f0();
 if(wasE){list.forEach(function(q){if(q.ans!==null)recordAnswer(q,q.ans===q.a)});var per={};Object.keys(res).forEach(function(k){per[k]={ok:res[k][0],n:res[k][1]}});
  var ex=lsGet("exams",[]);ex.push({date:new Date().toISOString(),score:score,total:list.length,pct:Math.round(100*score/list.length),perChapter:per});lsSet("exams",ex.slice(-50))}
 lsDel("session");HIST=lsGet("hist",HIST)};
})();
/* ===== Écran « Mes statistiques » ===== */
function fmtDate(d){try{return new Date(d).toLocaleString("fr-CA",{dateStyle:"medium",timeStyle:"short"})}catch(e){return String(d)}}
function showStats(){var s=lsGet("stats",{answered:0,correct:0}),m=computeMastery(),ex=lsGet("exams",[]),seen=Object.keys(HIST).length,weak=Q.filter(function(_,i){return isWeak(i)}).length;
 var rows=Object.keys(CH).map(function(c){var x=m[c];return'<tr><td>'+CH[c]+'</td><td>'+(x.rate==null?"–":x.rate+" %")+'</td><td>'+x.mastery+' %</td><td>'+x.att+'</td></tr>'}).join("");
 var er=ex.slice().reverse().slice(0,10).map(function(e){return'<tr><td>'+fmtDate(e.date)+'</td><td>'+e.score+' / '+e.total+' ('+e.pct+' %)</td><td>'+Object.keys(e.perChapter).map(function(k){var p=e.perChapter[k];return"Ch. "+k+" : "+p.ok+"/"+p.n}).join(" · ")+'</td></tr>'}).join("");
 var o=$("statsOv");o.innerHTML='<div class="card"><div class="qh"><b>📊 Mes statistiques</b><button id="stX" class="sec">✕ Fermer</button></div><div class="qb">'+
 '<p>Questions répondues : <b>'+s.answered+'</b><br>Taux de réussite : <b>'+(s.answered?Math.round(100*s.correct/s.answered)+" %":"–")+'</b><br>Questions vues : <b>'+seen+' / '+Q.length+'</b> · À revoir : <b>'+weak+'</b></p>'+
 '<h3>Par chapitre</h3><table><tr><th>Chapitre</th><th>Réussite</th><th>Maîtrise*</th><th>Essais</th></tr>'+rows+'</table><p style="font-size:.85em">* Maîtrise = part des questions du chapitre réussies à la dernière tentative.</p>'+
 '<h3>Derniers examens</h3>'+(er?'<table><tr><th>Date</th><th>Note</th><th>Par chapitre</th></tr>'+er+'</table>':'<p>Aucun examen terminé pour l’instant.</p>')+
 '<p><button id="stR" class="sec">🗑️ Réinitialiser ma progression</button></p></div></div>';o.hidden=false;
 $("stX").onclick=function(){o.hidden=true};$("stR").onclick=resetProgress}
function resetProgress(){if(!confirm("Réinitialiser toute ta progression ? (historique, statistiques, examens et session en cours seront effacés)"))return;
 lsClearAll();HIST={};$("statsOv").hidden=true;mode="P";chf="all";setModeBtns();start()}
(function(){var css=document.createElement("style");css.textContent=
 ".bdg{display:inline-block;font-size:.8em;font-weight:normal;padding:2px 8px;border-radius:10px;margin-left:6px;white-space:nowrap}.bdg.nw{background:#e7f1fb;color:#1a7f37}.bdg.okb{background:#e6f4ea;color:#1a7f37}.bdg.kob{background:#fdecea;color:#b42318}"+
 "#statsOv{position:fixed;inset:0;z-index:50;background:#f3f5f8;overflow:auto;-webkit-overflow-scrolling:touch;padding:calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}#statsOv>.card{max-width:900px;margin:0 auto}#statsOv table{width:100%}";
 document.head.appendChild(css);var ov=document.createElement("div");ov.id="statsOv";ov.hidden=true;document.body.appendChild(ov);
 var b=$("bE");b.insertAdjacentHTML("afterend",'<button id="bR" class="sec">🔁 Revoir mes erreurs</button>');
 $("flt").insertAdjacentHTML("afterend",'<div><button id="bS" class="sec">📊 Mes statistiques</button><button id="bX" class="sec">🗑️ Réinitialiser ma progression</button></div>');
 $("bS").onclick=showStats;$("bX").onclick=resetProgress;
 document.addEventListener("click",function(){setTimeout(saveSession,0)},true);
 document.addEventListener("touchend",function(){setTimeout(saveSession,350)},{passive:true});
 document.addEventListener("visibilitychange",function(){if(document.visibilityState=="hidden")saveSession()});
 window.addEventListener("pagehide",saveSession);})();
</script>
<script>
(function(){let cur=0;const qs=$("qs"),mn=document.querySelector("main");
function show(i){const cs=qs.querySelectorAll(":scope>.card");if(!cs.length){$("ct").textContent="";return}
 cur=Math.max(0,Math.min(cs.length-1,i));cs.forEach((c,k)=>c.classList.toggle("cur",k==cur));
 $("ct").textContent=(cur+1)+" / "+cs.length;$("pv").disabled=cur==0;$("nx").disabled=cur==cs.length-1;
 $("fin").hidden=mode!="E"||document.body.classList.contains("done");mn.scrollTop=0}
window.goQ=show;
const r0=render;render=function(){r0();document.body.classList.remove("done");show(0)};
const s0=start;start=function(){document.body.classList.remove("done");s0();$("cfg").classList.add("hide");show(0)};
const f0=finish;finish=function(){f0();document.body.classList.add("done");$("fin").hidden=true;$("ct").textContent="Résultats";$("pv").disabled=false;$("nx").disabled=true;mn.scrollTop=0;
 $("pv").onclick=()=>{document.body.classList.remove("done");$("pv").onclick=()=>show(cur-1);show(cur)}};
$("pv").onclick=()=>show(cur-1);$("nx").onclick=()=>show(cur+1);$("fin").onclick=()=>finish();

let sx=0,sy=0,st=0;mn.addEventListener("touchstart",e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});
mn.addEventListener("touchend",e=>{if(document.body.classList.contains("done"))return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;

document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault());

const de=document.documentElement,req=de.requestFullscreen||de.webkitRequestFullscreen,
 ex=document.exitFullscreen||document.webkitExitFullscreen,fe=()=>document.fullscreenElement||document.webkitFullscreenElement,
 en=document.fullscreenEnabled||document.webkitFullscreenEnabled,fb=$("fs");
if(req&&en){fb.hidden=false;fb.onclick=()=>{try{fe()?ex.call(document):req.call(de)}catch(_){}};
 const u=()=>fb.textContent=fe()?"✕ Quitter":"⛶ Plein écran";document.addEventListener("fullscreenchange",u);document.addEventListener("webkitfullscreenchange",u)}
start();})();
